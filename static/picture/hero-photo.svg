<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- TODO: 替换为真实主视觉图（建议 1440x1120，JPG/PNG/WebP 均可） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#FBEAFF"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" rx="36" fill="url(#bg)"/>
  <circle cx="70" cy="80" r="110" fill="#6366F1" opacity=".07"/>
  <circle cx="670" cy="500" r="140" fill="#A855F7" opacity=".08"/>
  <circle cx="650" cy="60" r="70" fill="#EC4899" opacity=".06"/>

  <!-- live call card -->
  <rect x="180" y="84" width="360" height="392" rx="30" fill="#fff" opacity=".92"/>
  <circle cx="360" cy="236" r="64" fill="url(#acc)"/>
  <circle cx="360" cy="218" r="22" fill="#fff" opacity=".95"/>
  <path d="M312 288a48 34 0 0 1 96 0v6h-96z" fill="#fff" opacity=".95"/>
  <rect x="206" y="106" width="54" height="24" rx="12" fill="#FF4D6D"/>
  <circle cx="218" cy="118" r="4" fill="#fff"/>
  <text x="228" y="123" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">LIVE</text>
  <g fill="url(#acc)">
    <rect x="320" y="426" width="6" height="16" rx="3"/>
    <rect x="332" y="416" width="6" height="36" rx="3"/>
    <rect x="344" y="406" width="6" height="56" rx="3"/>
    <rect x="356" y="420" width="6" height="28" rx="3"/>
    <rect x="368" y="410" width="6" height="48" rx="3"/>
    <rect x="380" y="424" width="6" height="20" rx="3"/>
  </g>

  <!-- floating chat bubble -->
  <g transform="translate(24 252)">
    <rect width="176" height="62" rx="20" fill="#fff" opacity=".95"/>
    <path d="M28 61l-4 18 22-18z" fill="#fff" opacity=".95"/>
    <text x="20" y="38" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#10132B">Nice to meet you!</text>
  </g>

  <!-- floating heart bubble -->
  <g transform="translate(566 150)">
    <rect width="84" height="52" rx="18" fill="#fff" opacity=".95"/>
    <path d="M42 39.5C36.5 34.9 29 30.6 29 24.6 29 20.4 32.4 17 36.6 17c2.1 0 4.2 1 5.4 2.8 1.2-1.8 3.3-2.8 5.4-2.8 4.2 0 7.6 3.4 7.6 7.6 0 6-7.5 10.3-13 14.9Z" fill="#FF4D6D"/>
  </g>

  <!-- floating likes pill -->
  <g transform="translate(552 396)">
    <rect width="100" height="44" rx="22" fill="#fff" opacity=".95"/>
    <circle cx="26" cy="22" r="12" fill="url(#acc2)"/>
    <text x="46" y="27" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#10132B">1.2k</text>
  </g>

  <path d="M620 74c1 4.2 2.8 6 7 7-4.2 1-6 2.8-7 7-1-4.2-2.8-6-7-7 4.2-1 6-2.8 7-7Z" fill="#A855F7" opacity=".55"/>

  <text x="700" y="538" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8A90A6">Replace this placeholder image</text>
